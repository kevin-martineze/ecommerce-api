services:
  postgres:
    image: postgres:17-alpine
    container_name: tienda-api-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tienda
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Los scripts de esta carpeta corren en orden alfabético la primera vez
      # que se crea el volumen. Si cambias uno, hay que borrar el volumen
      # (`docker compose down -v`) para que vuelva a ejecutarse.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d tienda']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
